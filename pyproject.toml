# Python environment for the BMS demo, managed by uv.
#
# The production sources import nothing outside the standard library, so the
# only dependency is the test runner. It lives in the `dev` group and is pinned
# by `uv.lock`, which is COMMITTED: `uv sync` reproduces the exact interpreter
# and the exact pytest build on every machine.
#
# `package = false` because `src/` is not distributed. The test modules import
# it as `src.<stream>.<module>` from the repository root, which the root
# `conftest.py` puts on `sys.path` — nothing is installed into the environment.

[project]
name = "demo-bms"
version = "0.1.0"
description = "Battery management system demo: everything-as-code across a minimized V-model."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

# --- ubTRACE EXPORT ------------------------------------------------------------
# The ubTrace export is a SECOND consumer of the same sources: `ubc build needs`
# compiles the graph for the CLI and the IDE, and `sphinx-build -b ubtrace`
# compiles the SAME `docs/specs/**` (plus the two `.. src-trace::` pages that
# materialise the code-marker needs) into the artefact `upload_ubtrace.sh` ships
# to team.useblocks.com. Both read their ontology out of `ubproject.toml`, so the
# need types, links and extra options are declared exactly once.
#
# It lives in an EXTRA, not in `dependencies`, so the documented setup
# (`uv sync` -> interpreter + pytest) stays lean; the export build runs
# `uv run --extra ubtrace sphinx-build ...`.
[project.optional-dependencies]
ubtrace = [
    "sphinx>=8.0,<9",
    "sphinx-needs>=9.1,<10",    # reads [needs] from ubproject.toml: types as tables, fields and links per type, derived fields
    "sphinx-codelinks>=2.0.1",  # reads [codelinks] from ubproject.toml; multi-line need blocks
    "sphinx-test-reports>=3.0.1",  # reads [test_reports]: the `test-file` page specs/_global/test_run.rst
    "sphinx-mounts>=0.3",       # reads [[source.variant_sources]]: the LFP-only page
    "myst-parser>=4.0",         # the Markdown (MyST) stream, specs/isolation-monitoring/
    "furo>=2024.8",
    "ubt-sphinx==0.8.1",        # the `ubtrace` builder itself
    "beautifulsoup4",           # ubt-sphinx imports it without declaring it
    "sphinxcontrib-plantuml>=0.30",
]

# `ubt-sphinx` (and its `ubt-runtime` dependency) are published to the PRIVATE
# useblocks index; the public PyPI copies are yanked ("new package location"), so
# a plain PyPI resolve of the `ubtrace` extra fails. Listing the index here —
# ahead of the implicit PyPI default — is what makes `uv sync --extra ubtrace`
# work: uv resolves `ubt-*` from pypi.useblocks.com and every other dependency
# falls through to PyPI.
[[tool.uv.index]]
name = "useblocks"
url = "https://pypi.useblocks.com/"
