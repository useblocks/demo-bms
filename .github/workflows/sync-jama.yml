name: Jama sync

# Acquire the system requirements from Jama every night and PROPOSE the change as
# a pull request. Nothing lands on main by itself: a human reviews the diff —
# which is the change notification Jama never sent — and merges it, and the merge
# is what `ubtrace.yml` then publishes to ubTrace.
#
#   02:30 UTC   this job runs `tools/sync_alm.py`, in whichever mode is committed
#   no diff     it stops. An unchanged Jama gives an EMPTY diff, because the sync
#               normalises what it writes — so an empty diff really means nothing
#               moved, and no pull request is opened
#   a diff      it runs the review gate (stale reviews), and opens
#               (or updates) the pull request `sync/jama` with both reports in
#               the description: which requirements changed, and which
#               reviews went out of date
#
# Once, nightly, never per build: the Jama REST API degrades under continuous
# sync load, and a live coupling between the ALM and every SW build is exactly
# the failure mode this pattern exists to avoid.
#
# SECRETS. The job skips — a notice, not a red run — until all of these exist:
#   JAMA_USERNAME, JAMA_PASSWORD       the Jama OAuth client id and secret
#   UBCONNECT_LICENSE_KEY / _USER      a ubConnect systems (SUC) licence
#   UBCODE_LICENSE_KEY / _USER         the ubc licence the graph gates already use
# Optional:
#   SYNC_BOT_TOKEN                     a PAT or GitHub App token. A pull request
#                                      opened with the default GITHUB_TOKEN does
#                                      not trigger other workflows, so without
#                                      this the graph gates in ubtrace.yml do not
#                                      run on the bot's pull request.

on:
  schedule:
    - cron: "30 2 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jama-sync
  cancel-in-progress: false

env:
  # The same engine the graph gates pin, and the ubConnect build verified against
  # the Jama partner instance.
  UBC_VERSION: "0.35.0"
  UBCONNECT_VERSION: "0.19.0"
  BRANCH: sync/jama

jobs:
  sync:
    name: Acquire the system level from Jama
    runs-on: ubuntu-latest
    steps:
      - name: Are the credentials configured?
        id: creds
        env:
          JAMA_USERNAME: ${{ secrets.JAMA_USERNAME }}
          JAMA_PASSWORD: ${{ secrets.JAMA_PASSWORD }}
          UBCONNECT_LICENSE_KEY: ${{ secrets.UBCONNECT_LICENSE_KEY }}
          UBCONNECT_LICENSE_USER: ${{ secrets.UBCONNECT_LICENSE_USER }}
          UBCODE_LICENSE_KEY: ${{ secrets.UBCODE_LICENSE_KEY }}
          UBCODE_LICENSE_USER: ${{ secrets.UBCODE_LICENSE_USER }}
        run: |
          missing=""
          for var in JAMA_USERNAME JAMA_PASSWORD UBCONNECT_LICENSE_KEY \
                     UBCONNECT_LICENSE_USER UBCODE_LICENSE_KEY UBCODE_LICENSE_USER; do
            [ -n "${!var}" ] || missing="$missing $var"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Jama sync skipped — repository secret(s) not set:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.ready == 'true'
        with:
          token: ${{ secrets.SYNC_BOT_TOKEN || github.token }}

      - name: Set up Python
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install ubConnect
        # A standalone binary, not a pip package.
        if: steps.creds.outputs.ready == 'true'
        run: |
          url="https://download.useblocks.com/ubconnect/${UBCONNECT_VERSION}/ubconnect-linux-x64-${UBCONNECT_VERSION}"
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/ubconnect" "$url"
          chmod +x "$RUNNER_TEMP/ubconnect"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install ubc
        if: steps.creds.outputs.ready == 'true'
        uses: useblocks/ubc-action@393f60bb24e9988cd62f2044e4e200ad253395a7 # main, 2026-03-25
        with:
          version: ${{ env.UBC_VERSION }}
          license-key: ${{ secrets.UBCODE_LICENSE_KEY }}
          license-user: ${{ secrets.UBCODE_LICENSE_USER }}

      - name: Acquire from Jama
        if: steps.creds.outputs.ready == 'true'
        env:
          JAMA_USERNAME: ${{ secrets.JAMA_USERNAME }}
          JAMA_PASSWORD: ${{ secrets.JAMA_PASSWORD }}
          UBCONNECT_LICENSE_KEY: ${{ secrets.UBCONNECT_LICENSE_KEY }}
          UBCONNECT_LICENSE_USER: ${{ secrets.UBCONNECT_LICENSE_USER }}
        run: python3 tools/sync_alm.py

      - name: Did anything move in Jama?
        id: diff
        if: steps.creds.outputs.ready == 'true'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Jama is unchanged since the last sync — nothing to propose."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git status --short
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Analyse the change
        # Informational here: the pull request is where a human decides.
        if: steps.diff.outputs.changed == 'true'
        run: |
          ubc agent verdict-check -p docs > "$RUNNER_TEMP/verdicts.json" 2>/dev/null || true
          {
            echo "Nightly acquisition of the system requirements from Jama."
            echo "Jama is the master; this pull request is its change notification."
            echo
            echo "### What changed"
            echo '```'
            git diff --stat
            echo '```'
            echo
            echo "### Review gate"
            python3 - "$RUNNER_TEMP/verdicts.json" <<'PY'
          import json, sys
          try:
              report = json.load(open(sys.argv[1]))
          except Exception:
              print("_verdict-check produced no report_")
              raise SystemExit
          outdated = report.get("outdated") or []
          if not outdated:
              print("No review verdict went out of date.")
          else:
              print(f"{len(outdated)} review verdict(s) are out of date and need a fresh review:")
              for need in outdated:
                  print(f"- `{need}`")
          PY
            echo
            echo "After a new review of the outdated needs: commit, merge."
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md"

      - name: Propose the change
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_BOT_TOKEN || github.token }}
        run: |
          git config user.name "jama-sync[bot]"
          git config user.email "jama-sync@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add --all docs
          git commit --quiet -m "Jama sync $(date -u +%Y-%m-%d)"
          git push --force --quiet origin "$BRANCH"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Jama sync $(date -u +%Y-%m-%d)" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
