# Check the needs graph with `ubc`, refresh the files derived from it, then build
# and publish the ubTrace export. See the README for the reasoning behind the
# write-back, the concurrency split and the commit-based publishing.
#
#   push main / tag    build + publish (as "main", or under the tag name)
#   push demo**        build only
#   pull_request        build only
#   workflow_dispatch   republish "main" or a tag by name
#
# Needs secrets UBTRACE_INGEST_TOKEN, UBCODE_LICENSE_KEY and UBCODE_LICENSE_USER.
name: ubTrace publish

on:
  push:
    branches:
      - main
      # `**` matches across slashes; `demo*` would miss `demo/cell-balancing`.
      - "demo**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag name, "main", or a demo branch — a demo branch builds but does not publish)'
        required: true
        default: "main"

# `graph-gates` pushes the regenerated files back to the branch.
permissions:
  contents: write

# Must track the `ubc --version` of the ubCode extension the team runs, since that
# engine produced the committed snapshots. Passed to ubc-action explicitly: its own
# default is 0.27.0.
env:
  UBC_VERSION: "0.34.0"

jobs:
  graph-gates:
    name: Graph gates (ubc)
    runs-on: ubuntu-latest
    # The commit this run validated, and the only one `publish` may build.
    outputs:
      sha: ${{ steps.writeback.outputs.sha }}
    # Cancellable: nothing here is published, and a cancelled gate job also stops
    # the run before `publish`. `inputs.ref` is in the key because `github.ref` for
    # a dispatch is the branch the workflow file was read from.
    concurrency:
      group: ${{ github.workflow }}-gates-${{ github.event.inputs.ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR's head commit, not its merge commit: the refresh has to be
          # committable onto a branch. Full history, so it can be rebased.
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Require a ubCode license
        # Unlicensed, `ubc` caps indexing at 5 files and 100 needs (this project has
        # 22 and 194) and fails talking about file counts, never about a secret.
        # Keys are user-based, so both the key and its e-mail are required.
        env:
          UBCODE_LICENSE_KEY: ${{ secrets.UBCODE_LICENSE_KEY }}
          UBCODE_LICENSE_USER: ${{ secrets.UBCODE_LICENSE_USER }}
        run: |
          missing=""
          [ -n "${UBCODE_LICENSE_KEY:-}" ]  || missing="$missing UBCODE_LICENSE_KEY"
          [ -n "${UBCODE_LICENSE_USER:-}" ] || missing="$missing UBCODE_LICENSE_USER"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — the ubc graph gates cannot run without a ubCode license. Add them under Settings > Secrets and variables > Actions, or contact support@useblocks.com for a key."
            exit 1
          fi
          echo "license secrets present"

      - name: Install ubc
        # Pinned to a SHA: a composite action is plain YAML executed in this job,
        # and this one publishes no moving tag to follow.
        uses: useblocks/ubc-action@393f60bb24e9988cd62f2044e4e200ad253395a7 # main, 2026-03-25
        with:
          version: ${{ env.UBC_VERSION }}
          license-key: ${{ secrets.UBCODE_LICENSE_KEY }}
          license-user: ${{ secrets.UBCODE_LICENSE_USER }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Parse the sources
        id: parse
        run: ubc check

      - name: Refresh the imported artefacts
        id: refresh
        # Staleness is not a failure here; an unusable report or an importer
        # rejecting a freshly captured snapshot is.
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/gaps.json"
          # A found gap exits non-zero (one is deliberate here), so the exit code is
          # not the test — the output has to parse. Captured to a temp file and
          # copied in afterwards: redirecting into the snapshot would truncate it
          # before `ubc` produced a byte.
          rc=0
          ubc agent gaps > "$out" || rc=$?
          probe="import json,sys; d=json.load(open(sys.argv[1])); raise SystemExit(0 if 'gaps' in d and 'ok' in d else 1)"
          if ! python3 -c "$probe" "$out" 2>/dev/null; then
            echo "::error::ubc agent gaps produced no usable report (exit $rc)"
            cat "$out" || true
            exit 1
          fi
          cp "$out" reports/gaps/gaps.json
          python3 tools/import_gaps.py
          python3 tools/import_test_results.py

      - name: Commit the refresh
        id: writeback
        # Pushes with the GITHUB_TOKEN `actions/checkout` persisted, which is the
        # loop guard: GitHub raises no workflow runs for that token's events. The
        # cost is a branch tip carrying no checks of its own.
        env:
          HEAD_REF: ${{ github.head_ref }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -uo pipefail
          # Every exit path names a commit that exists on the remote, never this
          # working tree.
          publishes() { echo "sha=$1" >> "$GITHUB_OUTPUT"; echo "publishing $1"; }
          original="$(git rev-parse HEAD)"
          generated=(reports/gaps/gaps.json specs/_global/gaps.rst specs/_global/test_results.rst)
          if git diff --quiet -- "${generated[@]}"; then
            echo "the generated specs were already current"
            echo "refreshed=false" >> "$GITHUB_OUTPUT"
            publishes "$original"
            exit 0
          fi
          echo "refreshed=true" >> "$GITHUB_OUTPUT"
          git diff -- "${generated[@]}"

          # Only a branch this token may write, and never a tag.
          target=""
          if [ -n "${HEAD_REF:-}" ]; then
            if [ "${IS_FORK:-false}" != "true" ]; then target="$HEAD_REF"; fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; then
            target="$GITHUB_REF_NAME"
          fi
          if [ -z "$target" ]; then
            echo "::warning::The generated specs are stale and this run cannot push a refresh back (fork PR, tag build, or dispatched republish), so $original is published AS COMMITTED. Run 'git config core.hooksPath .githooks' once, or the two importers by hand, and commit the result."
            publishes "$original"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${generated[@]}"
          git commit -m "chore: refresh generated specs"

          # A push to the branch mid-run makes this a non-fast-forward: rebase and
          # retry, never force.
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/$target"; then
              echo "pushed the refresh to $target"
              publishes "$(git rev-parse HEAD)"
              exit 0
            fi
            echo "push to $target rejected (attempt $attempt) — rebasing onto the new tip"
            # Explicit refspec: checkout leaves a narrow `remote.origin.fetch`
            # behind after a SHA checkout.
            if ! git fetch origin "+refs/heads/$target:refs/remotes/origin/$target" \
               || ! git rebase "origin/$target"; then
              git rebase --abort 2>/dev/null || true
              echo "::error::Could not rebase the refresh onto $target. Refresh the generated specs locally and commit them."
              exit 1
            fi
          done
          echo "::error::Gave up pushing the refresh to $target after 3 attempts."
          exit 1

      - name: Report the trace matrix and the substance gate
        # Informational. Both exit non-zero by design here — `trace` on the
        # deliberate gap, `verdict-check` as soon as anyone edits a requirement.
        continue-on-error: true
        run: |
          set -uo pipefail
          ubc agent trace | tee "$RUNNER_TEMP/trace.json" || true
          ubc agent verdict-check | tee "$RUNNER_TEMP/verdicts.json" || true

      - name: Job summary
        # `always()`, because a summary is worth most when a gate failed;
        # gate_summary.py renders every unreadable input as a note rather than
        # failing. The `--result` labels are the blocking steps only.
        if: always()
        run: |
          python3 tools/gate_summary.py \
            --ubc-version "$UBC_VERSION" \
            --result "Sources parse=${{ steps.parse.outcome }}" \
            --result "Imported artefacts refreshed=${{ steps.refresh.outcome }}" \
            --result "Refresh committed=${{ steps.writeback.outcome }}" \
            --gaps "$RUNNER_TEMP/gaps.json" \
            --trace "$RUNNER_TEMP/trace.json" \
            --verdicts "$RUNNER_TEMP/verdicts.json" \
            >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish ubTrace artefact
    # Structural, not just ordering: the commit built here comes from this job.
    needs: graph-gates
    runs-on: ubuntu-latest
    # Never cancelled: upload_ubtrace.sh publishes with one
    # `curl ?overwrite=true`, so a request killed halfway is a truncated archive
    # replacing the live version.
    concurrency:
      group: ${{ github.workflow }}-publish-${{ github.event.inputs.ref || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # By SHA, not `github.ref`: re-resolving the branch would build whatever
          # tip exists now, which may be a commit this run never gated.
          ref: ${{ needs.graph-gates.outputs.sha }}

      - name: Prove we are on the validated commit
        env:
          EXPECTED: ${{ needs.graph-gates.outputs.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::Expected to build ${EXPECTED:-<empty>}, but the checkout is at $actual"
            exit 1
          fi
          echo "building $actual"

      - name: Install uv
        # Exact release: setup-uv publishes moving major tags only up to v7.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install mermaid-cli, and prove it can render
        # Scripts do not run in the ubTrace export, so conf.py pre-renders the
        # `.. mermaid::` diagrams when `mmdc` is on PATH. mmdc drives a headless
        # Chromium that has failed on this runner before ("No usable sandbox!"), so
        # a probe render decides: on failure mmdc is removed and the build falls
        # back to raw diagrams. Never let this fail the job.
        continue-on-error: true
        run: |
          set -uo pipefail
          if ! npm install -g @mermaid-js/mermaid-cli; then
            echo "::warning::mermaid-cli install failed — diagrams will not be pre-rendered"
            exit 0
          fi
          printf 'flowchart LR\n    A --> B\n' > "$RUNNER_TEMP/probe.mmd"
          if ! mmdc -p mermaid-puppeteer.json \
                    -i "$RUNNER_TEMP/probe.mmd" -o "$RUNNER_TEMP/probe.svg"; then
            echo "::warning::mermaid-cli cannot render on this runner — removing it so the build falls back to raw diagrams"
            npm uninstall -g @mermaid-js/mermaid-cli
          fi

      - name: Install graphviz
        # Not optional, unlike mermaid: conf.py fails the build without `dot`.
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz
          dot -V

      - name: Install Python dependencies
        run: uv sync --extra ubtrace

      - name: Compute UBTRACE_VERSION
        id: vars
        # Emits the version to build as, and whether it may be uploaded — a demo
        # branch is defined by the second. Deriving `publish` from the resolved ref
        # rather than the event makes a dispatch of a demo branch behave like a push
        # of one. The patterns are enforced because the value becomes a path and a
        # URL segment, and the dispatch input is free text.
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ref="${INPUT_REF}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            ref="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF_NAME" == demo* ]]; then
            ref="$GITHUB_REF_NAME"
          else
            ref="main"
          fi
          publish=true
          if [[ "$ref" == demo* ]]; then
            publish=false
            if [[ ! "$ref" =~ ^demo[A-Za-z0-9._/-]*$ ]]; then
              echo "::error::Refusing to build: demo ref '$ref' contains characters that may not appear in a version path" >&2
              exit 1
            fi
          elif [[ "$ref" != "main" && ! "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*$ ]]; then
            echo "::error::Refusing to publish: ref '$ref' is neither 'main', a demo branch, nor v<MAJOR>.<MINOR>.<PATCH>[suffix]" >&2
            exit 1
          fi
          echo "version=$ref" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}

      - name: Build ubTrace artefact
        env:
          UBTRACE_VERSION: ${{ steps.vars.outputs.version }}
        # `-W --keep-going`: the export must build warning-free.
        run: |
          uv run --extra ubtrace sphinx-build -b ubtrace -W --keep-going \
            -D "ubtrace_version=${UBTRACE_VERSION}" \
            . _build/ubtrace

      - name: Upload to team.useblocks.com
        # To publish demo versions later, flip `publish` above — but note
        # upload_ubtrace.sh finds the built version at exactly depth 3, so a
        # slashed name (`demo/foo`) nests one level deeper and needs handling.
        if: github.event_name != 'pull_request' && steps.vars.outputs.publish == 'true'
        env:
          UBTRACE_INGEST_TOKEN: ${{ secrets.UBTRACE_INGEST_TOKEN }}
          UBTRACE_VERSION: ${{ steps.vars.outputs.version }}
        run: bash upload_ubtrace.sh
