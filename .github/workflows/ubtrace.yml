# Gate this project's needs graph with `ubc`, then build its ubTrace artefact and
# publish it to team.useblocks.com.
#
# Two jobs, in order. `graph-gates` runs the ubc CLI against the sources — the same
# commands you run locally — and `publish` only starts once they pass, so a stale or
# broken graph is never published. The CLI comes from useblocks/ubc-action, which is
# nothing more than a download-and-PATH composite action; see the job for why the
# version is pinned here rather than left to the action's default.
#
# Triggers:
#   push to main    -> builds and publishes as version "main" (overwriting it).
#   push of a tag   -> builds and publishes under the tag name, alongside "main".
#   pull request     -> builds only, no upload: the gate that a change keeps the
#                       ubTrace export building warning-free before it lands.
#   workflow_dispatch -> republish "main", or re-publish an old tag by name.
#
# Required repository secret:
#   UBTRACE_INGEST_TOKEN — a token with "Ingest" permission on the
#   useblocks/rollout-demo-bms project at team.useblocks.com.
name: ubTrace publish

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build and publish (tag name, or "main")'
        required: true
        default: "main"

permissions:
  contents: read

# The ubc CLI version the gates run. Declared here, once, because it has to track
# the version the team runs locally — ubCode ships the CLI inside the VS Code
# extension, so `ubc --version` there is the number that belongs in this line.
# It is passed explicitly to useblocks/ubc-action on purpose: that action's own
# default is 0.27.0 and lags well behind (its only tag, 0.1, is older still), so
# relying on the default would silently gate this project with a different engine
# than the one that produced its committed snapshots.
env:
  UBC_VERSION: "0.34.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --- THE GRAPH GATES ----------------------------------------------------------
  # Everything here is `ubc` or a stdlib-only importer, so this job needs no uv, no
  # graphviz and no mermaid — it is the cheap, fast half of the pipeline and it
  # fails before the expensive build starts.
  #
  # What it is actually defending. This project carries two IMPORTED artefacts,
  # `test_result` and `gap`, and each is a three-link chain:
  #
  #     reality -> committed snapshot -> generated RST -> published artefact
  #
  # The importers' `--check` modes have always been able to gate the second link
  # (snapshot -> RST). The FIRST link had nothing gating it until this job: nothing
  # in CI could tell whether `reports/gaps/gaps.json` still matched what the engine
  # actually reports, because there was no `ubc` on the runner. That is exactly the
  # hole useblocks/ubc-action closes.
  graph-gates:
    name: Graph gates (ubc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Require a ubCode license
        # ubc is COMMERCIAL software and this repository is PRIVATE, so the free
        # open-source mode does not apply: ubCode grants that only to projects under
        # an OSI licence in a publicly reachable Git repo, and it probes the remote
        # to decide. Unlicensed, ubc caps indexing at 5 files and 100 needs; this
        # project has 22 and 194, so every gate below fails with
        # "exceeds maximum without license".
        #
        # This preflight exists because that failure names the wrong culprit. The
        # action's own `ubc --version` check passes unlicensed, so without this step
        # the job would install cleanly and then die inside `ubc check` with a
        # message about file counts — nothing pointing at a missing repository
        # secret. Fail here instead, naming the secrets.
        #
        # BOTH are needed: useblocks licence keys are user-based, so the key without
        # the e-mail it was issued to does not activate.
        # https://ubcode.useblocks.com/usage/ublicense.html
        env:
          UBCODE_LICENSE_KEY: ${{ secrets.UBCODE_LICENSE_KEY }}
          UBCODE_LICENSE_USER: ${{ secrets.UBCODE_LICENSE_USER }}
        run: |
          missing=""
          [ -n "${UBCODE_LICENSE_KEY:-}" ]  || missing="$missing UBCODE_LICENSE_KEY"
          [ -n "${UBCODE_LICENSE_USER:-}" ] || missing="$missing UBCODE_LICENSE_USER"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — the ubc graph gates cannot run without a ubCode license. Add them under Settings > Secrets and variables > Actions, or contact support@useblocks.com for a key."
            exit 1
          fi
          echo "license secrets present"

      - name: Install ubc
        # Pinned to the current `main` commit, not to the `0.1` tag: that tag is two
        # commits behind and predates the version bump, and the action publishes no
        # moving major tag to follow. A composite action is plain YAML executed in
        # this job, so pinning the exact SHA is the only way to know what runs.
        #
        # The action exports the two inputs as UBCODE_LICENSE_KEY / UBCODE_LICENSE_USER
        # for every later step in the job, which is how the gates below are licensed.
        # Note the runner is ephemeral, so ubc's 3-day licence cache is always cold
        # and each run performs one online activation request.
        uses: useblocks/ubc-action@393f60bb24e9988cd62f2044e4e200ad253395a7 # main, 2026-03-25
        with:
          version: ${{ env.UBC_VERSION }}
          license-key: ${{ secrets.UBCODE_LICENSE_KEY }}
          license-user: ${{ secrets.UBCODE_LICENSE_USER }}

      - name: Set up Python
        # Only for the two importers, which are standard-library-only by design.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Parse the sources
        id: parse
        # The cheapest real gate there is: `ubc check` reports RST problems and exits
        # non-zero on an error. Nothing in this pipeline validated the specs as specs
        # before — the Sphinx build only proved they render.
        run: ubc check

      - name: The gap snapshot still matches reality
        id: snapshot
        # `reports/gaps/gaps.json` is a COMMITTED snapshot (see the README). This is
        # the step that stops it drifting: re-run the gate here and require the output
        # to be byte-identical to what is committed.
        #
        # The exit code is deliberately NOT the gate. `ubc agent gaps` exits non-zero
        # whenever it finds a gap, and this project has one ON PURPOSE
        # (REQ_CELL_BALANCING_WINDOW), so gating on the exit code would fail every run
        # and gating on `|| true` would hide a crashed binary. Instead the output is
        # required to parse as a gap report first — that is what proves the command
        # ran — and only then compared.
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/gaps.json"
          # `run:` executes under `bash -e`, and a found gap exits non-zero, so the
          # command has to be written in a form that does not abort the step.
          rc=0
          ubc agent gaps > "$out" || rc=$?
          probe="import json,sys; d=json.load(open(sys.argv[1])); raise SystemExit(0 if 'gaps' in d and 'ok' in d else 1)"
          # stderr is dropped: a JSONDecodeError traceback tells the reader nothing
          # the explicit error line below does not, and it buries it.
          if ! python3 -c "$probe" "$out" 2>/dev/null; then
            echo "::error::ubc agent gaps produced no usable report (exit $rc)"
            cat "$out" || true
            exit 1
          fi
          if ! diff -u reports/gaps/gaps.json "$out"; then
            echo "::error::reports/gaps/gaps.json is stale. Refresh it with 'ubc agent gaps > reports/gaps/gaps.json' and re-run 'python3 tools/import_gaps.py'."
            exit 1
          fi
          echo "gap snapshot is current"

      - name: The generated specs still match their snapshots
        id: generated
        # The second link of both chains. These are the same `--check` modes the
        # README documents; they were never wired into CI.
        run: |
          python3 tools/import_gaps.py --check
          python3 tools/import_test_results.py --check

      - name: Report the trace matrix and the substance gate
        # INFORMATIONAL, never blocking, and both for the same reason: this repo is a
        # demo whose whole point is that it has one real gap and live-editable review
        # verdicts. `ubc agent trace` exits non-zero on that deliberate gap, and
        # `ubc agent verdict-check` goes red the moment someone edits a requirement
        # during a demo — which is the behaviour the README asks people to show off,
        # not a reason to break main. The numbers are worth having; the exit codes are
        # not worth gating on.
        #
        # `tee` rather than a plain redirect: the JSON feeds the job summary below AND
        # stays in the step log, so the run page and the log tell the same story. The
        # trailing `|| true` swallows the expected non-zero exits — `continue-on-error`
        # would too, but only after marking the step failed, and this step's outcome is
        # deliberately NOT one of the results the summary reports.
        continue-on-error: true
        run: |
          set -uo pipefail
          ubc agent trace | tee "$RUNNER_TEMP/trace.json" || true
          ubc agent verdict-check | tee "$RUNNER_TEMP/verdicts.json" || true

      - name: Job summary
        # `always()`, because a summary is worth most exactly when a gate failed — and
        # tools/gate_summary.py is written so that it cannot itself fail: every input is
        # optional and every unreadable one renders as a note.
        #
        # The three `--result` labels are the BLOCKING gates only. The step above is
        # left out on purpose: it exits non-zero by design here, and listing it would
        # put a red row in the summary for the one thing that is meant to be red.
        if: always()
        run: |
          python3 tools/gate_summary.py \
            --ubc-version "$UBC_VERSION" \
            --result "Sources parse=${{ steps.parse.outcome }}" \
            --result "Gap snapshot matches reality=${{ steps.snapshot.outcome }}" \
            --result "Generated specs match snapshots=${{ steps.generated.outcome }}" \
            --gaps "$RUNNER_TEMP/gaps.json" \
            --trace "$RUNNER_TEMP/trace.json" \
            --verdicts "$RUNNER_TEMP/verdicts.json" \
            >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish ubTrace artefact
    # Gate first, build second. Remove this line to make the gates advisory — the
    # one case where that is tempting is a `workflow_dispatch` republish of an OLD
    # tag, whose committed snapshots were produced by an older engine and may not
    # reproduce byte-for-byte under the UBC_VERSION pinned above.
    needs: graph-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install uv
        # Pinned to an exact release on purpose: setup-uv publishes moving
        # major tags only up to v7, so `@v10` does not resolve at all.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install mermaid-cli, and prove it can render
        # The three `.. mermaid::` component diagrams are pre-rendered to SVG
        # when `mmdc` is on PATH (see conf.py) — scripts do not run in the
        # ubTrace export, so a browser-rendered diagram would be blank there.
        #
        # mmdc drives a headless Chromium, which is the fragile part: it broke
        # the first publish from this workflow with "No usable sandbox!"
        # (Ubuntu's AppArmor restriction on unprivileged user namespaces), and
        # under `-W` three failed renders fail the whole build. So this step
        # RENDERS A PROBE DIAGRAM and, if that does not work, uninstalls mmdc
        # again — which drops conf.py back to the raw output and keeps the
        # publish going with three degraded diagrams instead of no artefact.
        # Never let this step fail the job: the diagrams are a nicety, the
        # traceability artefact is the point.
        continue-on-error: true
        run: |
          set -uo pipefail
          if ! npm install -g @mermaid-js/mermaid-cli; then
            echo "::warning::mermaid-cli install failed — diagrams will not be pre-rendered"
            exit 0
          fi
          printf 'flowchart LR\n    A --> B\n' > "$RUNNER_TEMP/probe.mmd"
          if ! mmdc -p mermaid-puppeteer.json \
                    -i "$RUNNER_TEMP/probe.mmd" -o "$RUNNER_TEMP/probe.svg"; then
            echo "::warning::mermaid-cli cannot render on this runner — removing it so the build falls back to raw diagrams"
            npm uninstall -g @mermaid-js/mermaid-cli
          fi

      - name: Install graphviz
        # `dot` renders the per-stream needflow diagrams on traceability.rst
        # (flow_engine = "graphviz" in ubproject.toml). Unlike the mermaid step
        # above this one is NOT optional: conf.py fails the build when `dot` is
        # missing, because a traceability page with no diagrams is worse than a
        # loud failure.
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz
          dot -V

      - name: Install Python dependencies
        run: uv sync --extra ubtrace

      - name: Compute UBTRACE_VERSION
        id: vars
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ref="${INPUT_REF}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            ref="$GITHUB_REF_NAME"
          else
            ref="main"
          fi
          # Defence in depth: the tag trigger already filters to
          # `v[0-9]+.[0-9]+.[0-9]+*`, but git tag names may contain shell
          # metacharacters that the trailing glob accepts, and the dispatch
          # input is free text. Reject anything outside "main" / a SemVer-ish
          # tag before it becomes a version segment in a URL and a path.
          if [[ "$ref" != "main" && ! "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*$ ]]; then
            echo "::error::Refusing to publish: ref '$ref' is neither 'main' nor v<MAJOR>.<MINOR>.<PATCH>[suffix]" >&2
            exit 1
          fi
          echo "version=$ref" >> "$GITHUB_OUTPUT"
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}

      - name: Build ubTrace artefact
        env:
          UBTRACE_VERSION: ${{ steps.vars.outputs.version }}
        # `-W --keep-going` is the gate: the export must build warning-free.
        # `-D ubtrace_version` overrides conf.py so a tag publishes as its own
        # version; it must stay in sync with what upload_ubtrace.sh packages,
        # which is why the same value is exported to that script below.
        run: |
          uv run --extra ubtrace sphinx-build -b ubtrace -W --keep-going \
            -D "ubtrace_version=${UBTRACE_VERSION}" \
            . _build/ubtrace

      - name: Upload to team.useblocks.com
        # Pull requests build the artefact but never publish it.
        if: github.event_name != 'pull_request'
        env:
          UBTRACE_INGEST_TOKEN: ${{ secrets.UBTRACE_INGEST_TOKEN }}
          UBTRACE_VERSION: ${{ steps.vars.outputs.version }}
        run: bash upload_ubtrace.sh
