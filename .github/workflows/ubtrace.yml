# Gate this project's needs graph with `ubc`, then build its ubTrace artefact and
# publish it to team.useblocks.com.
#
# Two jobs, in order. `graph-gates` runs the ubc CLI against the sources — the same
# commands you run locally — and `publish` only starts once they pass, so a stale or
# broken graph is never published. The CLI comes from useblocks/ubc-action, which is
# nothing more than a download-and-PATH composite action; see the job for why the
# version is pinned here rather than left to the action's default.
#
# Triggers:
#   push to main    -> builds and publishes as version "main" (overwriting it).
#   push of a tag   -> builds and publishes under the tag name, alongside "main".
#   push to demo**  -> builds only, no upload. A demo branch gets the full gate
#                       and build treatment, but nothing it produces reaches
#                       team.useblocks.com.
#   pull request     -> builds only, no upload: the gate that a change keeps the
#                       ubTrace export building warning-free before it lands.
#   workflow_dispatch -> republish "main", or re-publish an old tag by name.
#                       Dispatching a demo branch builds without uploading too:
#                       the upload is gated on WHAT WAS BUILT, not on the event.
#
# EVERY run, including a pull request and a demo branch, also builds the project as
# a single PDF and attaches it to the run — the one output of this workflow that
# needs no team.useblocks.com account to read. Retention is 7 days, except for a
# release tag, which keeps its PDF for 90.
#
# Required repository secret:
#   UBTRACE_INGEST_TOKEN — a token with "Ingest" permission on the
#   useblocks/rollout-demo-bms project at team.useblocks.com.
name: ubTrace publish

on:
  push:
    branches:
      - main
      # `**`, not `*`: a single star stops at a slash, so it would match
      # `demo-cell-balancing` but miss `demo/cell-balancing`.
      - "demo**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag name, "main", or a demo branch — a demo branch builds but does not publish)'
        required: true
        default: "main"

permissions:
  contents: read

# The ubc CLI version the gates run. Declared here, once, because it has to track
# the version the team runs locally — ubCode ships the CLI inside the VS Code
# extension, so `ubc --version` there is the number that belongs in this line.
# It is passed explicitly to useblocks/ubc-action on purpose: that action's own
# default is 0.27.0 and lags well behind (its only tag, 0.1, is older still), so
# relying on the default would silently gate this project with a different engine
# than the one that produced its committed snapshots.
env:
  UBC_VERSION: "0.35.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --- THE GRAPH GATES ----------------------------------------------------------
  # Everything here is `ubc` or a stdlib-only importer, so this job needs no uv, no
  # graphviz and no mermaid — it is the cheap, fast half of the pipeline and it
  # fails before the expensive build starts.
  #
  # What it is actually defending. This project carries two IMPORTED artefacts,
  # `test_result` and `gap`, and each is a three-link chain:
  #
  #     reality -> committed snapshot -> generated RST -> published artefact
  #
  # The importers' `--check` modes have always been able to gate the second link
  # (snapshot -> RST). The FIRST link had nothing gating it until this job: nothing
  # in CI could tell whether `docs/reports/gaps/gaps.json` still matched what the engine
  # actually reports, because there was no `ubc` on the runner. That is exactly the
  # hole useblocks/ubc-action closes.
  graph-gates:
    name: Graph gates (ubc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install ubc
        # Pinned to the current `main` commit, not to the `0.1` tag: that tag is two
        # commits behind and predates the version bump, and the action publishes no
        # moving major tag to follow. A composite action is plain YAML executed in
        # this job, so pinning the exact SHA is the only way to know what runs.
        #
        # No licence credentials are passed: this repository is public and
        # MIT-licensed, so ubc runs in its free open-source mode — it probes the
        # remote to decide. The runner is ephemeral, so ubc's licence cache is always
        # cold and each run performs one online licence check.
        uses: useblocks/ubc-action@393f60bb24e9988cd62f2044e4e200ad253395a7 # main, 2026-03-25
        with:
          version: ${{ env.UBC_VERSION }}

      - name: Set up Python
        # Only for the two importers, which are standard-library-only by design.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Parse the sources
        id: parse
        # The cheapest real gate there is: `ubc check` reports RST problems and exits
        # non-zero on an error. Nothing in this pipeline validated the specs as specs
        # before — the Sphinx build only proved they render.
        #
        # The project is `docs/` and there is NO configuration at the repository
        # root by design (see the README's layout section). A bare `ubc check` here
        # finds no project and passes silently, so the path is not optional.
        run: ubc check docs

      - name: The gap snapshot still matches reality
        id: snapshot
        # `docs/reports/gaps/gaps.json` is a COMMITTED snapshot (see the README). This is
        # the step that stops it drifting: re-run the gate here and require the output
        # to be byte-identical to what is committed.
        #
        # The exit code is deliberately NOT the gate. `ubc agent gaps` exits non-zero
        # whenever it finds a gap, and this project has one ON PURPOSE
        # (REQ_CELL_BALANCING_WINDOW), so gating on the exit code would fail every run
        # and gating on `|| true` would hide a crashed binary. Instead the output is
        # required to parse as a gap report first — that is what proves the command
        # ran — and only then compared.
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/gaps.json"
          # `run:` executes under `bash -e`, and a found gap exits non-zero, so the
          # command has to be written in a form that does not abort the step.
          rc=0
          ubc agent gaps -p docs > "$out" || rc=$?
          probe="import json,sys; d=json.load(open(sys.argv[1])); raise SystemExit(0 if 'gaps' in d and 'ok' in d else 1)"
          # stderr is dropped: a JSONDecodeError traceback tells the reader nothing
          # the explicit error line below does not, and it buries it.
          if ! python3 -c "$probe" "$out" 2>/dev/null; then
            echo "::error::ubc agent gaps produced no usable report (exit $rc)"
            cat "$out" || true
            exit 1
          fi
          if ! diff -u docs/reports/gaps/gaps.json "$out"; then
            echo "::error::docs/reports/gaps/gaps.json is stale. Refresh it with 'ubc agent gaps -p docs > docs/reports/gaps/gaps.json' and re-run 'python3 tools/import_gaps.py'."
            exit 1
          fi
          echo "gap snapshot is current"

      - name: The generated specs still match their snapshots
        id: generated
        # The second link of both chains. These are the same `--check` modes the
        # README documents; they were never wired into CI.
        run: |
          python3 tools/import_gaps.py --check
          python3 tools/import_test_results.py --check

      - name: Report the trace matrix and the substance gate
        # INFORMATIONAL, never blocking, and both for the same reason: this repo is a
        # demo whose whole point is that it has one real gap and live-editable review
        # verdicts. `ubc agent trace` exits non-zero on that deliberate gap, and
        # `ubc agent verdict-check` goes red the moment someone edits a requirement
        # during a demo — which is the behaviour the README asks people to show off,
        # not a reason to break main. The numbers are worth having; the exit codes are
        # not worth gating on.
        #
        # `tee` rather than a plain redirect: the JSON feeds the job summary below AND
        # stays in the step log, so the run page and the log tell the same story. The
        # trailing `|| true` swallows the expected non-zero exits — `continue-on-error`
        # would too, but only after marking the step failed, and this step's outcome is
        # deliberately NOT one of the results the summary reports.
        continue-on-error: true
        run: |
          set -uo pipefail
          ubc agent trace -p docs | tee "$RUNNER_TEMP/trace.json" || true
          ubc agent verdict-check -p docs | tee "$RUNNER_TEMP/verdicts.json" || true

      - name: Job summary
        # `always()`, because a summary is worth most exactly when a gate failed — and
        # tools/gate_summary.py is written so that it cannot itself fail: every input is
        # optional and every unreadable one renders as a note.
        #
        # The three `--result` labels are the BLOCKING gates only. The step above is
        # left out on purpose: it exits non-zero by design here, and listing it would
        # put a red row in the summary for the one thing that is meant to be red.
        if: always()
        run: |
          python3 tools/gate_summary.py \
            --ubc-version "$UBC_VERSION" \
            --result "Sources parse=${{ steps.parse.outcome }}" \
            --result "Gap snapshot matches reality=${{ steps.snapshot.outcome }}" \
            --result "Generated specs match snapshots=${{ steps.generated.outcome }}" \
            --gaps "$RUNNER_TEMP/gaps.json" \
            --trace "$RUNNER_TEMP/trace.json" \
            --verdicts "$RUNNER_TEMP/verdicts.json" \
            >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish ubTrace artefact
    # Gate first, build second. Remove this line to make the gates advisory — the
    # one case where that is tempting is a `workflow_dispatch` republish of an OLD
    # tag, whose committed snapshots were produced by an older engine and may not
    # reproduce byte-for-byte under the UBC_VERSION pinned above.
    needs: graph-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install uv
        # Pinned to an exact release on purpose: setup-uv publishes moving
        # major tags only up to v7, so `@v10` does not resolve at all.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install mermaid-cli, and prove it can render
        # The three `.. mermaid::` component diagrams are pre-rendered to SVG
        # when `mmdc` is on PATH (see conf.py) — scripts do not run in the
        # ubTrace export, so a browser-rendered diagram would be blank there.
        #
        # mmdc drives a headless Chromium, which is the fragile part: it broke
        # the first publish from this workflow with "No usable sandbox!"
        # (Ubuntu's AppArmor restriction on unprivileged user namespaces), and
        # under `-W` three failed renders fail the whole build. So this step
        # RENDERS A PROBE DIAGRAM and, if that does not work, uninstalls mmdc
        # again — which drops conf.py back to the raw output and keeps the
        # publish going with three degraded diagrams instead of no artefact.
        # Never let this step fail the job: the diagrams are a nicety, the
        # traceability artefact is the point.
        continue-on-error: true
        run: |
          set -uo pipefail
          if ! npm install -g @mermaid-js/mermaid-cli; then
            echo "::warning::mermaid-cli install failed — diagrams will not be pre-rendered"
            exit 0
          fi
          printf 'flowchart LR\n    A --> B\n' > "$RUNNER_TEMP/probe.mmd"
          if ! mmdc -p mermaid-puppeteer.json \
                    -i "$RUNNER_TEMP/probe.mmd" -o "$RUNNER_TEMP/probe.svg"; then
            echo "::warning::mermaid-cli cannot render on this runner — removing it so the build falls back to raw diagrams"
            npm uninstall -g @mermaid-js/mermaid-cli
          fi

      - name: Install graphviz
        # `dot` renders the per-stream needflow diagrams on traceability.rst
        # (flow_engine = "graphviz" in ubproject.toml). Unlike the mermaid step
        # above this one is NOT optional: conf.py fails the build when `dot` is
        # missing, because a traceability page with no diagrams is worse than a
        # loud failure.
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz
          dot -V

      - name: Install Python dependencies
        run: uv sync --extra ubtrace

      - name: Compute UBTRACE_VERSION
        id: vars
        # Emits TWO things: the version the artefact is built as, and whether it
        # may be uploaded. They are decided together, here, because a demo branch
        # is defined by the second: it is built like everything else and then not
        # published. Deriving `publish` from the resolved ref rather than from
        # `github.event_name` is what makes a workflow_dispatch of a demo branch
        # behave the same as a push of one — dispatch checks out `inputs.ref`, so
        # it can reach a demo branch just as easily.
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ref="${INPUT_REF}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            ref="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF_NAME" == demo* ]]; then
            # NOT collapsed into "main" like other branches: publishing is off
            # for demo branches, so the version only names the build directory,
            # and naming it after the branch keeps a run log self-explanatory.
            ref="$GITHUB_REF_NAME"
          else
            ref="main"
          fi
          # Defence in depth: the tag trigger already filters to
          # `v[0-9]+.[0-9]+.[0-9]+*`, but git tag names may contain shell
          # metacharacters that the trailing glob accepts, and the dispatch
          # input is free text. Reject anything outside "main" / a SemVer-ish
          # tag / a demo branch before it becomes a version segment in a URL and
          # a path. Demo names are held to the same character set even though
          # they are never uploaded, because the value still becomes a path.
          #
          # The chain below is written as one arm per KIND of ref, rather than as
          # the earlier "reject anything that is not X" test, because a third
          # question now hangs off it: a release tag is the only ref whose PDF is
          # kept longer than a week, so "is this a release" has to be an answer
          # the chain produces rather than something re-derived later from
          # `github.ref_type` — which a workflow_dispatch of a tag gets wrong,
          # since dispatch always reports `branch` however it was invoked.
          publish=true
          release=false
          if [[ "$ref" == demo* ]]; then
            publish=false
            if [[ ! "$ref" =~ ^demo[A-Za-z0-9._/-]*$ ]]; then
              echo "::error::Refusing to build: demo ref '$ref' contains characters that may not appear in a version path" >&2
              exit 1
            fi
          elif [[ "$ref" == "main" ]]; then
            :
          elif [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*$ ]]; then
            release=true
          else
            echo "::error::Refusing to publish: ref '$ref' is neither 'main', a demo branch, nor v<MAJOR>.<MINOR>.<PATCH>[suffix]" >&2
            exit 1
          fi
          # 7 days for everything that is not a tag. main and the demo branches are
          # rebuilt constantly and their PDF is only ever read within days of the run
          # that produced it; a release PDF is the one people come back to, so it gets
          # the 90-day repository maximum. Note GitHub CAPS this at the retention
          # limit configured for the repository and silently lowers anything above it.
          retention=7
          [[ "$release" == true ]] && retention=90
          # Artifact names may not contain a slash, and `demo/foo` is an accepted
          # branch shape here (the `**` in the trigger matches it on purpose), so the
          # name — and only the name — flattens it.
          echo "version=$ref" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "retention=$retention" >> "$GITHUB_OUTPUT"
          echo "pdf_name=bms-specs-${ref//\//-}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}

      - name: Install ubc
        # A SECOND install of the same pinned action. Jobs do not share a filesystem,
        # so the ubc the graph gates installed is on another runner and this one
        # starts bare. No licence credentials are passed, for the same reason as the
        # graph-gates job: this public, MIT-licensed repository runs ubc's free
        # open-source mode.
        uses: useblocks/ubc-action@393f60bb24e9988cd62f2044e4e200ad253395a7 # main, 2026-03-25
        with:
          version: ${{ env.UBC_VERSION }}

      - name: Build the specification PDF
        id: pdf
        # `ubc build pdf` runs NO Sphinx and no LaTeX — it typesets the same index
        # `ubc check` and the editor use — so it needs none of the uv / graphviz /
        # mermaid apparatus installed above, and it cannot be folded into the
        # sphinx-build below. It is ALPHA: the layout and the options may still move
        # between releases, which is another reason it is a run attachment and not
        # something published to team.useblocks.com.
        #
        # Placed BEFORE the ubTrace build on purpose. The two are independent, and in
        # this order a sphinx failure still leaves a PDF for the upload to attach.
        #
        # THERE IS NO `--deny` OVERRIDE HERE, deliberately. The builder does not
        # typeset `needflow` or `mermaid` yet and draws each as a labelled placeholder
        # box plus a `build.pdf_diagram_unrendered` warning — 8 of them in this
        # project — which under the default `--deny warning` bar exits 1 on a
        # perfectly healthy graph. `--deny error` would fix that by retiring the
        # warning bar altogether; instead docs/ubproject.toml ignores THAT ONE CODE,
        # so the bar here stays at `warning` and any other build warning still fails
        # this step. `-w` prints the detail of whatever is left.
        env:
          PDF_NAME: ${{ steps.vars.outputs.pdf_name }}
        run: ubc build pdf docs -w -o "_build/pdf/${PDF_NAME}.pdf"

      - name: Attach the PDF to the run
        # `always()`, because a run that failed later is exactly when someone wants to
        # read the specs it built — but guarded on the build step actually having
        # produced a file, so a failed PDF build reports itself once rather than twice.
        #
        # Retention is 7 days for main, demo branches and pull requests, and 90 for a
        # release tag; see the version step for why that decision is made there.
        if: always() && steps.pdf.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.vars.outputs.pdf_name }}
          path: _build/pdf/${{ steps.vars.outputs.pdf_name }}.pdf
          retention-days: ${{ steps.vars.outputs.retention }}
          if-no-files-found: error

      - name: Build ubTrace artefact, once per variant
        env:
          UBTRACE_VERSION: ${{ steps.vars.outputs.version }}
        # `-W --keep-going` is the gate: the export must build warning-free, for
        # every variant. `-D ubtrace_version` overrides conf.py so a tag publishes
        # as its own version; it must stay in sync with what upload_ubtrace.sh
        # packages, which is why the same value is exported to that script below.
        #
        # The variants come from `[ubtrace.variants]` in docs/ubproject.toml: one
        # build per entry, each in its own root, with the entry's data file and
        # dimensions passed as `-D` flags. One line per variant: its name, then
        # the `-D` values, which contain no spaces. Read on fd 3 so sphinx-build
        # cannot consume the list from stdin.
        run: |
          set -euo pipefail
          python3 - > "$RUNNER_TEMP/variants.txt" <<'EOF'
          import tomllib
          with open("docs/ubproject.toml", "rb") as f:
              variants = tomllib.load(f)["ubtrace"]["variants"]
          for name, v in variants.items():
              flags = [f"needs_variant_data_file={v['variant_data_file']}"]
              flags += [f"ubtrace_dimensions.{k}={val}" for k, val in v["dimensions"].items()]
              print(name, *flags)
          EOF
          while read -r variant overrides <&3; do
            flags=(-D "ubtrace_version=${UBTRACE_VERSION}")
            for o in ${overrides}; do flags+=(-D "$o"); done
            echo "::group::Build variant ${variant}: ${overrides}"
            uv run --extra ubtrace sphinx-build -b ubtrace -W --keep-going \
              "${flags[@]}" docs "_build/ubtrace/${variant}"
            echo "::endgroup::"
          done 3< "$RUNNER_TEMP/variants.txt"

      - name: Upload to team.useblocks.com
        # Pull requests and demo branches build the artefact but never publish
        # it. `steps.vars.outputs.publish` carries the demo half of that rule so
        # it holds however the demo branch was reached — a push, or a dispatch
        # naming it. To start publishing demo versions later, flip that flag —
        # but note a slashed branch name (`demo/foo`) then needs handling too:
        # upload_ubtrace.sh locates the built version at exactly depth 3 under
        # the build root, and such a name nests one level deeper.
        #
        # Every variant goes to the same version URL with `?overwrite=true`; the
        # dimensions inside each artefact keep the uploads apart on the server.
        if: github.event_name != 'pull_request' && steps.vars.outputs.publish == 'true'
        env:
          UBTRACE_INGEST_TOKEN: ${{ secrets.UBTRACE_INGEST_TOKEN }}
          UBTRACE_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          for build_root in _build/ubtrace/*/; do
            echo "::group::Upload variant $(basename "${build_root}")"
            BUILD_ROOT="${build_root%/}" bash upload_ubtrace.sh
            echo "::endgroup::"
          done
