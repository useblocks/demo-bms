"$schema" = "https://ubcode.useblocks.com/ubproject.schema.json"

[project]
name = "bms"
version = "0.1.0"

[source]
# Skip framework-internal directories so they are not parsed as needs.
extend_exclude = [".specify"]

[needs]
id_required = true
id_regex = "^[A-Z]+_[A-Z][A-Z0-9_]*$"

# Render the `needflow` diagrams on `traceability.rst` with the local graphviz
# `dot` instead of PlantUML: no Java, no jar to vendor, and the graphviz engine
# emits a PNG plus an HTML image map — a plain <img> with clickable nodes, which
# is what survives the ubTrace export (scripts do not run there, and the viewer
# resolves <img> assets only). conf.py fails the build early when `dot` is
# missing rather than letting the diagrams degrade silently.
flow_engine = "graphviz"

# --- EXTRA OPTIONS ---
# Fields the built-in need schema does not carry. These three exist for the
# `test_result` type: they hold what a JUnit `<testcase>` element reports, so the
# imported evidence is queryable as need FIELDS rather than buried in prose.
# `outcome` is the one worth filtering on (`type == "test_result" and outcome !=
# "passed"`); `runtime_s` and `test_run_label` give the reader the run it came from.
# Extra options are global in ubCode — declared once, available on every type —
# so they are simply left unset on the spec needs.

[[needs.extra_options]]
name = "outcome"
description = "Recorded outcome of one test case in one run: passed, failed, error or skipped."

[[needs.extra_options]]
name = "runtime_s"
description = "Wall-clock runtime of that test case, in seconds, as the report recorded it."

# NAMED `test_run_label`, not `test_run`, and holding a NON-ISO timestamp. Both
# details are load-bearing for the ubTrace export:
#
# Extra options are global, so this field is also written as "" on every need
# that is not a `test_result`. ubTrace indexes needs into Elasticsearch with
# dynamic mapping and date detection on, so an ISO-8601 value types the field
# as `date` for the whole index and every need carrying "" is then rejected
# ("cannot parse empty datetime"). Elasticsearch mappings are IMMUTABLE, so
# once an index has learned `test_run: date` it keeps rejecting, and re-ingesting
# corrected data cannot repair it — only deleting the index can. The rename to
# a field the live index has never seen is what escapes that stuck mapping;
# the space-instead-of-`T` format is what stops the new field being typed as a
# date in turn. See `_run_label` in tools/import_test_results.py.
[[needs.extra_options]]
name = "test_run_label"
description = "Identifier of the test run the outcome came from: the report's timestamp, as a label."

# The chain roll-up, stamped on every generated `test_result`: the ids of the
# system requirements this result is evidence for, resolved through
# `test -> swreq -> arch -> req`.
#
# It exists because a REPORT TEMPLATE CANNOT WALK LINKS. `ubc report` builds each
# need in its Jinja context from that need's scalar FIELDS only, so `id`, `type`,
# `title`, `status`, `tags`, `doctype` and these extra options are reachable while
# every LINK field (`satisfies`, `refines`, `verifies`, `results_for`, …) is
# absent. A template that reads `n.verifies` gets undefined, and the usual
# `(n.verifies or [])` guard silently turns that into an empty list — so a
# link-based coverage report renders clean and reports 0 % everywhere.
#
# Stamping the resolved chain onto the generated artefact is what moves the answer
# from a link (invisible to a template) into a field (visible), so
# `reports/traceability_coverage.html.j2` is plain Jinja that `ubc report` and the
# VS Code Reports view render with no extra tooling. It is DERIVED data on a
# DERIVED need — `tools/import_test_results.py` resolves it from the spec sources
# on every run, and nothing hand-maintains it.
[[needs.extra_options]]
name = "chain_reqs"
description = "System requirement ids this test result is evidence for, via test -> swreq -> arch -> req."

# BATTERY MANAGEMENT SYSTEM (BMS) — everything-as-code, MINIMIZED V-MODEL.
#
# The mandatory spine is exactly six stages:
#
#     user stories -> requirements -> architecture -> software requirements
#                                                          |
#                                                       code / tests
#
# authored SYMMETRICALLY across both arms of the lower V as NEEDS-IN-SOURCE:
#
# - the decomposition arm runs `user_story -> req -> arch -> swreq`. `swreq` is the
#   BOTTOM of the decomposition arm: it `refines` the `arch` element whose behaviour
#   it pins down, and it is the level BOTH lower arms attach to;
# - the implementation arm runs one `code` stage that PRODUCES an `impl` need: a
#   one-line codelinks marker in the production source materialises a real `impl`
#   need carrying its `implements` link UP to the `swreq` it realises, and the stage's
#   bidirectional `implements` trace edge counts the swreq's incoming
#   `implements_back` for coverage;
# - the verification arm runs one `tests` stage that PRODUCES a `test` need the same
#   way: a one-line marker in the test source materialises a real `test` need carrying
#   its `verifies` link UP to the `swreq` it covers, and the stage's bidirectional
#   `verifies` trace edge counts the swreq's incoming `verifies_back`.
#
# Both lower arms hang off `swreq`, NOT off `arch`: the software requirement is the
# last level that states testable behaviour, so it is the level code realises and the
# level a test can assert against. That is what closes the V at its point.
#
# Both lower arms are IMPL-/TESTS-AS-NEEDS: a one-line codelinks marker in source
# materialises a real need carrying its trace link, gated by the stage's trace edge.
# This replaces the earlier `@need-ids:` `code_url` back-attach (implementation arm)
# and the broken `unit_test_url` / `integ_test_url` / `e2e_test_url` URL-field split
# (verification arm), both of which back-attached a URL onto the arch instead of
# materialising a need and assumed a clean code-vs-test DIRECTORY layout.

# --- NEED TYPES (the V-model ontology) ---
# Rename, add, or remove types to match your project's V-model. Every type the
# [workflow] stages produce or trace against is declared here.

[[needs.types]]
directive = "user_story"
title = "User Story"
prefix = "US_"
color="#FDE68A"
style="usecase"

[[needs.types]]
directive = "req"
title = "Requirement"
prefix = "REQ_"
color="#FDBA74"
style="file"

[[needs.types]]
directive = "arch"
title = "Architecture"
prefix = "ARCH_"
color="#818CF8"
style="node"

# The BOTTOM of the decomposition arm. A software requirement states the testable
# behaviour of ONE architecture element: what the component shall do, across which
# interface, with which data, under which timing / resource / accuracy bound. It
# `refines` the `arch` it details, and it is the level BOTH lower arms attach to —
# `impl` implements a swreq, `test` verifies a swreq.
[[needs.types]]
directive = "swreq"
title = "Software Requirement"
prefix = "SWREQ_"
color="#7DD3FC"
style="card"

# The implementation-arm need: an implementation element authored as a real need via
# a one-line codelinks marker in production source. It `implements` the `swreq` it
# realises, and the `code` stage's trace edge counts that incoming `implements_back`
# for coverage.
[[needs.types]]
directive = "impl"
title = "Implementation"
prefix = "IMPL_"
color="#C084FC"
style="component"

# The verification-arm need: a test case authored as a real need via a one-line
# codelinks marker in test source. It `verifies` the `arch` it covers, and the
# `tests` stage's trace edge counts that incoming `verifies_back` for coverage.
[[needs.types]]
directive = "test"
title = "Test"
prefix = "TEST_"
color="#BBF7D0"
style="hexagon"

# The EXECUTION-EVIDENCE need: the recorded outcome of ONE test case in ONE test
# run, imported from a JUnit XML report rather than authored by hand. It is
# deliberately a separate type from `test`: a `test` need is the test case that
# EXISTS (the marker in the test source, part of the spec), whereas a
# `test_result` is what HAPPENED when that case last ran. Keeping them apart is
# what lets the report be replaced by a newer run without touching the spec, and
# what lets a `test` need legitimately exist with no result yet.
#
# Generated into `specs/_global/test_results.rst` by
# `tools/import_test_results.py` from `reports/junit/testresults.xml`. The XML is
# a COMMITTED SNAPSHOT: the suite is not re-run on every build.
[[needs.types]]
directive = "test_result"
title = "Test Result"
prefix = "TRES_"
color="#4ADE80"
style="database"

[[needs.types]]
directive = "risk"
title = "Risk"
prefix = "RISK_"
color="#F87171"
style="folder"

[[needs.types]]
directive = "decision"
title = "Decision"
prefix = "DEC_"
color="#D1D5DB"
style="frame"

# --- LINKS ---
# Declare every link the [workflow] trace edges reference here.

[needs.links.traces_to]
incoming = "traces_from"
outgoing = "traces_to"

[needs.links.satisfies]
incoming = "satisfied_by"
outgoing = "satisfies"

# The software-requirement link: a `swreq` need's outgoing `refines` points at the
# `arch` element whose behaviour it pins down. Deliberately NOT a second use of
# `satisfies`: one link name per level keeps a trace query unambiguous about which
# rung of the V it is walking.
[needs.links.refines]
incoming = "refined_by"
outgoing = "refines"

# The implementation link: an `impl` need's outgoing `implements` points at the `swreq`
# it realises; the swreq's incoming `implements_back` is what the `code` stage's trace
# edge counts. Declared here so `ubc build` emits the field and the one-line marker's
# `implements` list-field resolves to a real link (an undeclared link is silently
# ignored at runtime).
[needs.links.implements]
incoming = "implements_back"
outgoing = "implements"

# The verification link: a `test` need's outgoing `verifies` points at the `swreq`
# it covers; the swreq's incoming `verifies_back` is what the `tests` stage's trace
# edge counts. Declared here so `ubc build` emits the field and the one-line marker's
# `verifies` list-field resolves to a real link (an undeclared link is silently
# ignored at runtime).
[needs.links.verifies]
incoming = "verifies_back"
outgoing = "verifies"

# The execution-evidence link: a `test_result` need's outgoing `results_for`
# points at the `test` need whose run it records; the test's incoming `results`
# is how a query gets from a test case to its last recorded outcome. The
# `test_results` stage's trace edge names it, so this is the field the import
# writes on every generated need.
[needs.links.results_for]
incoming = "results"
outgoing = "results_for"

# The decision link: a `decision` need's outgoing `affects` points at the `arch` it
# constrains. The `decisions` stage's trace edge names it, so this is the field the
# authoring prompt orders on that stage.
[needs.links.affects]
incoming = "affected_by"
outgoing = "affects"

[needs.links.motivates]
incoming = "motivated_by"
outgoing = "motivates"

# The risk link: a `risk` need's outgoing `mitigates` points at the `req` it bears on.
# The `risks` stage's trace edge names it, so this is the field the authoring prompt
# orders on that stage.
[needs.links.mitigates]
incoming = "mitigated_by"
outgoing = "mitigates"

# --- CODELINKS (consumed by `ubc build`) ---
# Two projects, one per arm of the lower V — SYMMETRIC: each scans a source tree for
# ONE-LINE need markers (`get_oneline_needs = true`) and MATERIALISES a real need
# from each. Neither back-attaches a ref URL; both author needs.
#
# - `code` (the implementation arm) scans the production source for
#   `# @<title>, <IMPL_ID>, impl, [<SWREQ_ID>]` markers. The marker's link field is
#   named `implements` (not the default `links`) so the `implements`-keyed trace gate
#   sees it.
#
# - `tests` (the verification arm) scans the test source for
#   `# @<title>, <TEST_ID>, test, [<SWREQ_ID>]` markers. The marker's link field is
#   named `verifies` so the `verifies`-keyed trace gate sees it.
#
# One-line needs ONLY materialise where a `.. src-trace:: :project: <name>` directive
# appears in a built RST file (a config-only `[codelinks]` block creates none), so
# each stage authors that directive in its route's RST alongside the markers.

[codelinks]
set_local_url = true

# The implementation-arm project. `get_oneline_needs = true` materialises an `impl`
# need from each one-line marker in the production source; `get_need_id_refs` and
# `get_rst` stay off because this project's job is authoring `impl` needs, not
# back-attaching ref URLs or extracting RST blocks.
[codelinks.projects.code.source_discover]
src_dir = "src"
comment_type = "python"

[codelinks.projects.code.analyse]
get_oneline_needs = true
get_need_id_refs = false
get_rst = false

# The one-line marker grammar: `# @<title>, <IMPL_ID>, impl, [<SWREQ_ID>]`. The
# fourth field is NAMED `implements` (a `list[str]` link) so the materialised `impl`
# need carries an outgoing `implements` link — the link the `code` stage's trace edge
# counts. `implements` is declared in `[needs.links]` above, so it resolves to a real
# link instead of being silently dropped.
[codelinks.projects.code.analyse.oneline_comment_style]
field_split_char = ","
needs_fields = [
  { name = "title", type = "str" },
  { name = "id", type = "str" },
  { name = "type", type = "str", default = "impl" },
  { name = "implements", type = "list[str]", default = [
  ] },
]

# The verification-arm project. `get_oneline_needs = true` materialises a `test`
# need from each one-line marker in the test source; `get_need_id_refs` and
# `get_rst` stay off because this project's job is authoring `test` needs, not
# back-attaching ref URLs or extracting RST blocks.
[codelinks.projects.tests.source_discover]
src_dir = "tests"
comment_type = "python"

[codelinks.projects.tests.analyse]
get_oneline_needs = true
get_need_id_refs = false
get_rst = false

# The one-line marker grammar: `# @<title>, <TEST_ID>, test, [<SWREQ_ID>]`. The
# fourth field is NAMED `verifies` (a `list[str]` link) so the materialised `test`
# need carries an outgoing `verifies` link — the link the `tests` stage's trace edge
# counts. `verifies` is declared in `[needs.links]` above, so it resolves to a real
# link instead of being silently dropped.
[codelinks.projects.tests.analyse.oneline_comment_style]
field_split_char = ","
needs_fields = [
  { name = "title", type = "str" },
  { name = "id", type = "str" },
  { name = "type", type = "str", default = "test" },
  { name = "verifies", type = "list[str]", default = [
  ] },
]

# --- AGENT RUNNER (consumed by `ubc agent run`) ---
# `ubc agent run` spawns an AI runner to author the next-stage artefact. The
# prompt (recommended skill + the anchor need's context briefing + the resolved
# authoring route) is passed on the runner's stdin.
#
# There is NO default runner: this preset ships none, so `ubc agent run` reports
# "no runner configured" until you set one, rather than committing every project
# to a specific tool. Configure a runner by uncommenting the [agent.runner] table
# below, or set the UBC_AGENT_RUNNER / UBC_AGENT_RUNNER_MODEL / UBC_AGENT_RUNNER_TIMEOUT
# env vars, which take precedence over the table.
#
# `command` is the shell-less argv lead of a headless coding agent that can write
# files. `model` pins a model (e.g. "sonnet" for routine authoring). `timeout_secs`
# bounds one headless pass: a wedged runner that does not exit within the budget is
# killed (default 600s = 10min, 0 disables the bound). Example:
#
# [agent.runner]
# command = "claude -p --permission-mode acceptEdits --output-format stream-json --verbose"
# model = "sonnet"
# timeout_secs = 600

# --- WORKFLOW (consumed by `ubc agent next` / `status` / `gaps`) ---
# The MINIMIZED V-model process for the BMS:
#   - the decomposition arm runs the need-producing stages
#     `user_stories -> reqs -> archs -> swreqs` (each produces one type and traces up
#     to its parent);
#   - the implementation arm runs one `code` stage that produces an `impl` need (a
#     one-line marker in the production source materialises it) which
#     `implements`-links the swreq it realises. The stage's bidirectional `implements`
#     trace edge counts the swreq's incoming `implements_back`;
#   - the verification arm runs one `tests` stage that produces a `test` need (a
#     one-line marker in the test source materialises it) which `verifies`-links the
#     swreq it covers. The stage's bidirectional `verifies` trace edge counts the
#     swreq's incoming `verifies_back`,
# so every software requirement is both implemented AND verified.

# The spec needs (user_story, req, arch, swreq) are exempt from the orphan gate: they
# are decomposition artefacts, gated by their own trace edges, not by code coverage.
# `impl` and `test` are NOT exempt — they must trace UP to the swreq they cover.
# `risk` and `decision` are not exempt either, which is why the two optional stages
# below each declare a trace edge: a stage that owes a link to the orphan gate has to
# name the link it owes.
[workflow]
orphan_exempt_types = ["user_story", "req", "arch", "swreq"]

# The diagram SYNTAX the runner authors any diagram in. `format` is the authoring
# directive injected into the runner prompt ("author it as a `mermaid` directive");
# it is project policy, NOT baked into the (generic) skills. `enabled = false`
# keeps the diagram GATE off — only the authoring format is configured here.
[workflow.diagram]
enabled = false
format = "mermaid"

[[workflow.stages]]
id = "user_stories"
produces = "user_story"
review_skill = "review-feat"

[workflow.stages.route]
granularity = "per-root"
path = "specs/{stream}/user_stories.rst"
scope = "stream"

[[workflow.stages]]
author_skill = "draft-requirement"
authoring = "Decompose the use case into the complete set of requirements it implies — the happy path, the error and edge cases, and the relevant non-functional constraints."
depends_on = ["user_stories"]
id = "reqs"
produces = "req"
review_skill = "review-requirement"

[workflow.stages.route]
granularity = "per-root"
path = "specs/{stream}/requirements.rst"
scope = "stream"

[[workflow.stages.trace]]
direction = "both"
link = "traces_to"
min = 1
up = "user_story"

[[workflow.stages]]
author_skill = "draft-arch"
authoring = "Produce the architecture elements the requirements need (one per distinct responsibility, enough that every requirement is satisfied by at least one element), plus a component diagram showing how they relate."
depends_on = ["reqs"]
id = "archs"
produces = "arch"
review_skill = "review-arch"

[workflow.stages.route]
granularity = "per-root"
path = "specs/{stream}/architecture.rst"
scope = "stream"

[[workflow.stages.trace]]
direction = "both"
link = "satisfies"
min = 1
up = "req"

# --- SOFTWARE REQUIREMENTS STAGE (bottom of the decomposition arm) ---
# This stage turns each architecture element into the testable behaviour it owes. It
# is the LAST spec level, and the level both lower arms attach to: `code` implements a
# swreq and `tests` verifies a swreq. The bidirectional `refines` trace edge UP to
# `arch` gates both directions — every swreq must refine an arch, and every arch must
# be refined by at least one swreq, so no component is left without stated behaviour.
[[workflow.stages]]
author_skill = "draft-requirement"
authoring = "Decompose each architecture element into the software requirements it owes: the behaviour the component shall implement, the interfaces and signals it exchanges, its error and degraded-mode handling, and the timing, accuracy and resource bounds that constrain it. One shall-clause per requirement."
depends_on = ["archs"]
id = "swreqs"
produces = "swreq"
review_skill = "review-requirement"

[workflow.stages.route]
granularity = "per-root"
path = "specs/{stream}/software_requirements.rst"
scope = "stream"

[[workflow.stages.trace]]
direction = "both"
link = "refines"
min = 1
up = "arch"

# --- CODE STAGE (the implementation arm) ---
# This stage PRODUCES an `impl` need authored as a one-line codelinks marker in the
# production source (`# @<title>, <IMPL_ID>, impl, [<SWREQ_ID>]`), which
# `implements`-links the swreq it realises. The bidirectional `implements` trace edge
# UP to `swreq` drives coverage: it counts every swreq's incoming `implements_back`, so
# a swreq with no implementing element fails the gate and the stage stays `ready`
# until an impl covers it. Coverage is the TRACE EDGE, not `require_incoming` — the
# trace edge attributes the gap to THIS impl-producing stage (so `next` returns
# `code`), whereas `require_incoming` would mis-attribute it to the swreq's own stage
# and no-op `next`. SYMMETRIC to the `tests` stage below.
[[workflow.stages]]
author_skill = "draft-impl"
authoring = "Author one implementation need per software requirement as a one-line marker in the production source, each implementing the swreq it realises, so every swreq carries an incoming implements link. Put real production code beneath each marker."
depends_on = ["swreqs"]
id = "code"
produces = "impl"

[workflow.stages.route]
granularity = "global"
path = "src"
scope = "global"

[[workflow.stages.trace]]
direction = "both"
link = "implements"
min = 1
up = "swreq"

# --- TESTS STAGE (the verification arm) ---
# This stage PRODUCES a `test` need authored as a one-line codelinks marker in the
# test source (`# @<title>, <TEST_ID>, test, [<SWREQ_ID>]`), which `verifies`-links
# the swreq it covers. The bidirectional `verifies` trace edge UP to `swreq` drives
# coverage: it counts every swreq's incoming `verifies_back`, so a swreq with no
# verifying test fails the gate and the stage stays `ready` until a test covers it.
# Coverage is the TRACE EDGE, not `require_incoming` — the trace edge attributes the
# gap to THIS test-producing stage (so `next` returns `tests`), whereas
# `require_incoming` would mis-attribute it to the swreq's own stage and no-op `next`.
[[workflow.stages]]
author_skill = "draft-test"
authoring = "Author one test need per software requirement as a one-line marker in the test source, each verifying the swreq it covers, so every swreq carries an incoming verifies link."
depends_on = ["code"]
id = "tests"
produces = "test"

[workflow.stages.route]
granularity = "global"
path = "tests"
scope = "global"

[[workflow.stages.trace]]
direction = "both"
link = "verifies"
min = 1
up = "swreq"

# --- TEST RESULTS STAGE (optional, IMPORTED not authored) ---
# A `test_result` need `results_for` the `test` need whose run it records. This
# stage is unusual in two ways and both are deliberate.
#
# It is IMPORTED, not authored: there is no `author_skill`, because the artefact
# is generated by `tools/import_test_results.py` from the committed JUnit XML
# under `reports/junit/`. An agent has nothing to decide here — an imported
# outcome that a model could rewrite would not be evidence.
#
# It carries no `review_skill` either, for the same reason: a recorded outcome is
# a measurement, and scoring a measurement against a prose rubric would be
# meaningless.
#
# `direction = "outgoing"`, NOT `both`, exactly as for `risks` and `decisions`
# below: the forward leg is what names `results_for` and makes the generated link
# real coverage that closes the orphan gate. A BACKWARD leg would additionally
# require every `test` need to carry an incoming `results`, so a project whose
# report predates a newly added test case could never reach a clean
# `ubc agent gaps` — and "this test has no recorded result yet" is a legitimate
# state, not a gap.
[[workflow.stages]]
id = "test_results"
optional = true
produces = "test_result"

[workflow.stages.route]
granularity = "single"
path = "specs/_global/test_results.rst"
scope = "global"

[[workflow.stages.trace]]
direction = "outgoing"
link = "results_for"
min = 1
up = "test"

# --- RISKS STAGE (optional) ---
# A `risk` need `mitigates` the `req` it bears on. The trace edge is what NAMES
# that field in the authoring prompt: without it the prompt orders a trace link it
# cannot name, and a model fills the slot by guessing.
#
# `direction = "outgoing"`, NOT `both`, and that is the whole difference between a
# stage being optional and a stage only calling itself optional. The forward leg is
# what names `mitigates` and the parent req ids in the prompt, and it is what makes
# the authored link real coverage that closes the orphan gate. The BACKWARD leg
# would additionally require every `req` to carry an incoming `mitigated_by`, so a
# project that authors no risk at all could never reach a clean `ubc agent gaps`.
# `min` is read only by a bidirectional gate, so here it is what the prompt dictates
# to the author, not a number any gate counts.
[[workflow.stages]]
id = "risks"
optional = true
produces = "risk"

[workflow.stages.route]
granularity = "single"
path = "specs/_global/risks.rst"
scope = "global"

[[workflow.stages.trace]]
direction = "outgoing"
link = "mitigates"
min = 1
up = "req"

# --- DECISIONS STAGE (optional) ---
# A `decision` need `affects` the `arch` it constrains. Same reason as `risks`
# above, and the same `outgoing` direction for the same reason: the forward leg
# lets the prompt name the field and the parent ids, and it is what makes the
# authored link close the orphan gate instead of sitting outside `trace.outgoing`
# as traceability that is not there, while a backward leg would make every `arch`
# owe a decision before `ubc agent gaps` could go green.
[[workflow.stages]]
author_skill = "record-decision"
id = "decisions"
optional = true
produces = "decision"
review_skill = "review-decision"

[workflow.stages.route]
granularity = "single"
path = "specs/_global/decisions.rst"
scope = "global"

[[workflow.stages.trace]]
direction = "outgoing"
link = "affects"
min = 1
up = "arch"

# --- QUALITY ANALYSIS (consumed by `ubc agent review-brief` / `verdict-check`) ---
# The substance gate's rubric lives as DATA, not review-skill prose: each
# reviewed type below is wired to a per-type CRITERIA PACK — installed
# alongside this config at `quality/<name>.toml` — that supplies the axes
# (description + scoring_guide) a review brief surfaces. This keeps the
# review skills interface-agnostic ("score every axis your briefing's
# `criteria` names") and lets the rubric be tuned without touching a skill.
#
# One entry per type a review-carrying stage `produces` above: `req` (reqs,
# review-requirement), `arch` (archs, review-arch), `swreq` (swreqs,
# review-requirement), `user_story` (user_stories, review-feat), and `decision`
# (decisions, review-decision).
# `impl` / `test` / `risk` carry no `review_skill` and so need no pack.
[quality]
enabled = true

[quality.type_configs.req]
criteria_file = "quality/requirement.toml"

# `swreq` is requirement-shaped (one shall-clause, testable, traced to a parent), so
# it reuses the requirement pack rather than duplicating a near-identical rubric.
[quality.type_configs.swreq]
criteria_file = "quality/requirement.toml"

[quality.type_configs.arch]
criteria_file = "quality/arch.toml"

[quality.type_configs.user_story]
criteria_file = "quality/feat.toml"

[quality.type_configs.decision]
criteria_file = "quality/decision.toml"

# A couple of gentle per-axis floors — deliberately light. `parent_fit` is
# shared by the requirement/arch/feat packs (absent
# from the decision pack, where it is silently a no-op); `context_present`
# floors the decision pack's most fundamental axis directly.
[quality.required]
parent_fit = 1

[quality.type_configs.decision.required]
context_present = 1
